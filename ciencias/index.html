<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado de Ciências — 6º ano</title><style>body{font-family:system-ui,Arial;background:#f3f6f5;color:#172e28;margin:0}main{max-width:780px;margin:auto;padding:22px}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px #0001}h1{color:#136b51}button{background:#136b51;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.5}label{display:block;padding:12px;margin:8px 0;border:1px solid #d6e1db;border-radius:9px;cursor:pointer}label:has(input:checked){background:#e5f5ec;border-color:#136b51}input{margin-right:10px}.muted{color:#586a63}.ok{color:#167445}.bad{color:#b42318}#result{font-size:20px}</style></head><body><main><h1>🧪 Simulado de Ciências — 6º ano</h1><p>40 questões • Conteúdo FTD • Funciona no celular</p><section class="card" id="intro"><p>Escolha o modo de estudo:</p><label><input type="radio" name="mode" value="prova" checked>Modo prova — resultado apenas no final</label><label><input type="radio" name="mode" value="treino">Modo treinamento — feedback após cada resposta</label><button onclick="start()">Iniciar simulado</button></section><section id="quiz" hidden><div class="card"><p class="muted" id="progress"></p><h2 id="question"></h2><div id="choices"></div><p id="feedback"></p><button id="next" onclick="advance()">Próxima</button></div></section><section id="finish" class="card" hidden><h2>Resultado</h2><p id="result"></p><div id="review"></div><button onclick="location.reload()">Refazer</button></section></main><script>const questions=[["Transformação física é aquela em que:",["surge uma nova substância","não se forma uma nova substância","sempre há fogo","sempre há gás"],1],["Qual é uma transformação química?",["amassar lata","cortar papel","queimar madeira","derreter gelo"],2],["A ferrugem nos pregos indica:",["mudança de formato","transformação química","evaporação","fusão"],1],["Qual evidência pode indicar reação química?",["formação de gás","mudança de posição","corte do material","mudança de recipiente"],0],["Na fotossíntese, as plantas produzem:",["sal e areia","glicose e oxigênio","ferro e água","álcool e óleo"],1],["O crescimento da massa de pão ocorre devido principalmente à:",["produção de gás pelas leveduras","fusão da farinha","condensação do sal","imantação da água"],0],["Qual processo é transformação física?",["cozinhar ovo","queimar papel","derreter sorvete","enferrujar ferro"],2],["A passagem do sólido para o líquido é:",["condensação","fusão","solidificação","sublimação"],1],["A passagem do líquido para o sólido é:",["vaporização","fusão","solidificação","condensação"],2],["A passagem do gasoso para o líquido é:",["condensação","fusão","sublimação","ebulição"],0],["O gelo-seco passa diretamente do sólido ao gasoso. Isso é:",["fusão","solidificação","sublimação","condensação"],2],["A água fervendo em uma panela sofre:",["solidificação","ebulição","fusão","condensação"],1],["O suor secando na pele exemplifica:",["evaporação","fusão","solidificação","sublimação"],0],["A principal diferença entre evaporação e ebulição é:",["evaporação só ocorre a 100 °C","ebulição ocorre em todo o líquido com formação de bolhas","evaporação produz novo material","ebulição é solidificação"],1],["No estado gasoso, um material apresenta:",["forma e volume definidos","forma definida e volume variável","forma e volume não definidos","apenas forma definida"],2],["Um líquido tem:",["forma própria e volume próprio","forma variável e volume definido","forma e volume sempre indefinidos","forma definida e volume indefinido"],1],["No ciclo da água, a formação de nuvens envolve:",["condensação","combustão","fusão do ferro","fermentação"],0],["A água dos rios pode retornar à atmosfera por:",["evaporação","solidificação","imantação","combustão"],0],["Uma propriedade geral dos materiais é:",["temperatura de fusão","solubilidade","massa","propriedade magnética"],2],["A unidade equivalente a 1 kg é:",["10 g","100 g","1 000 g","10 000 g"],2],["A inércia é:",["capacidade de dissolver","resistência à mudança do estado de movimento","capacidade de ferver","temperatura de fusão"],1],["Um corpo com maior massa geralmente apresenta:",["menor inércia","maior inércia","densidade zero","volume nulo"],1],["Um litro corresponde a:",["10 mL","100 mL","1 000 mL","10 000 mL"],2],["Um centímetro cúbico equivale a:",["1 mL","1 L","100 mL","1 000 L"],0],["Um objeto eleva a água de 500 mL para 680 mL. Seu volume é:",["80 cm³","180 cm³","500 cm³","680 cm³"],1],["A densidade é calculada por:",["volume dividido pela massa","massa dividida pelo volume","massa mais volume","massa vezes temperatura"],1],["Um objeto tem 200 g e 100 cm³. Sua densidade é:",["0,5 g/cm³","2 g/cm³","20 g/cm³","200 g/cm³"],1],["O óleo flutua sobre a água porque:",["é mais denso","tem menor densidade","tem maior massa sempre","é magnético"],1],["Um bloco de alumínio afunda na água porque:",["sua densidade é maior que a da água","é solúvel em água","é mais frio","não tem volume"],0],["Qual material é atraído por um ímã?",["madeira","vidro","ferro","borracha"],2],["A capacidade de um material se dissolver em outro é:",["densidade","solubilidade","inércia","fusão"],1],["Na mistura de água e sal, o solvente é:",["sal","água","ambos são solutos","nenhum"],1],["Na mistura de água e sal, o soluto é:",["água","sal","recipiente","vapor"],1],["Ao nível do mar, a água pura ferve aproximadamente a:",["0 °C","50 °C","100 °C","200 °C"],2],["Ao nível do mar, a água pura congela aproximadamente a:",["−114 °C","0 °C","78 °C","100 °C"],1],["Qual material é líquido a 50 °C, segundo a tabela do livro?",["ferro","ouro","álcool","prata"],2],["O que se forma na decomposição de matéria orgânica em biodigestores?",["biogás e biofertilizante","apenas vidro","ferro e plástico","somente papel"],0],["Os microrganismos no biodigestor:",["impedem qualquer reação","decompõem matéria orgânica","produzem alumínio","transformam água em ouro"],1],["O biogás pode ser aproveitado para:",["gerar energia","fabricar pedras preciosas","impedir a reciclagem","substituir todos os metais"],0],["Qual atitude ajuda a reduzir resíduos e impactos ambientais?",["queimar plástico a céu aberto","descartar lixo em rios","reciclar materiais e tratar resíduos","jogar óleo na pia"],2]];let i=0,answers=[],mode='prova';function start(){mode=document.querySelector('input[name=mode]:checked').value;document.getElementById('intro').hidden=true;document.getElementById('quiz').hidden=false;show()}function show(){const q=questions[i];document.getElementById('progress').textContent='Questão '+(i+1)+' de '+questions.length;document.getElementById('question').textContent=q[0];document.getElementById('choices').innerHTML=q[1].map((x,j)=>'<label><input type="radio" name="answer" value="'+j+'">'+String.fromCharCode(65+j)+') '+x+'</label>').join('');document.getElementById('feedback').textContent='';document.getElementById('next').textContent=i===questions.length-1?'Finalizar':'Próxima'}function advance(){const selected=document.querySelector('input[name=answer]:checked');if(!selected){alert('Escolha uma alternativa.');return}const a=Number(selected.value);answers.push(a);if(mode==='treino'){const q=questions[i];alert(a===q[2]?'Correto!':'Resposta correta: '+String.fromCharCode(65+q[2])+') '+q[1][q[2]])}i++;if(i<questions.length){show()}else{document.getElementById('quiz').hidden=true;document.getElementById('finish').hidden=false;const correct=answers.filter((a,j)=>a===questions[j][2]).length;document.getElementById('result').textContent='Acertos: '+correct+' de '+questions.length+' | Nota: '+(correct/4).toFixed(1).replace('.',',')+' / 10';document.getElementById('review').innerHTML=questions.map((q,j)=>'<p class="'+(answers[j]===q[2]?'ok':'bad')+'"><strong>'+(j+1)+'. '+q[0]+'</strong><br>Sua resposta: '+String.fromCharCode(65+answers[j])+'. Correta: '+String.fromCharCode(65+q[2])+') '+q[1][q[2]]+'</p>').join('')}}</script></body></html>
