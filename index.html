<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado de História — 6º ano</title><style>body{font:17px system-ui,-apple-system,sans-serif;background:#f2f5fa;color:#18263c;margin:0}main{max-width:720px;margin:25px auto;padding:20px}section{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 24px #172a4215}h1{font-size:28px}h2{font-size:22px}button,select{font:inherit}button{background:#1558b0;color:white;border:0;border-radius:12px;padding:13px 20px;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.45}.choice{display:block;border:1px solid #ccd6e3;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}.choice:has(input:checked){border-color:#1558b0;background:#edf5ff}.muted{color:#57667b}.ok{color:#087747}.bad{color:#b42318}#bar{height:8px;background:#e5eaf0;border-radius:10px;overflow:hidden}#fill{height:100%;background:#1558b0;width:0}label{cursor:pointer}select{padding:9px;border-radius:8px}summary{cursor:pointer}#error{color:#b42318}</style></head><body><main><section><h1>🏛️ Simulado de História — 6º ano</h1><p class="muted">Grécia Antiga e Roma Antiga • 32 questões</p><div id="app"><p>Escolha o modo de estudo:</p><select id="mode"><option value="prova">Modo prova — correção no final</option><option value="treino">Modo treinamento — correção a cada questão</option></select><p><label><input type="checkbox" id="shuffle"> Embaralhar perguntas</label></p><button id="start">Começar simulado</button></div><p id="error"></p></section></main><script>
(function(){'use strict';
var bank=[["Qual civilização se desenvolveu na ilha de Creta?","Minoica","Romana","Persa","Etrusca",0,"A civilização minoica floresceu em Creta."],["Qual centro foi importante para a civilização micênica?","Cartago","Micenas","Roma","Alexandria",1,"Micenas foi um centro da civilização micênica."],["Na tradição grega, os poemas Ilíada e Odisseia são atribuídos a quem?","Sócrates","Homero","Péricles","Alexandre",1,"Os poemas épicos são tradicionalmente atribuídos a Homero."],["O que eram as pólis gregas?","Províncias romanas","Cidades-Estados autônomas","Impérios coloniais","Templos",1,"Cada pólis possuía instituições e organização próprias."],["Qual característica favoreceu a existência de várias pólis independentes?","Território plano","Relevo montanhoso","Deserto contínuo","Ausência de mares",1,"O relevo montanhoso dificultava a integração territorial."],["A ágora era principalmente...","uma praça pública","uma fortaleza","um navio","uma fazenda",0,"A ágora era um espaço de encontro, comércio e debate."],["Esparta destacou-se por sua...","formação militar","indústria moderna","democracia universal","navegação oceânica",0,"A educação espartana valorizava disciplina e preparo militar."],["Na sociedade espartana, os hilotas eram...","reis","trabalhadores submetidos ao domínio espartano","sacerdotes romanos","comerciantes estrangeiros",1,"Os hilotas realizavam trabalho agrícola sob dominação."],["Quem eram os esparciatas?","Cidadãos com direitos políticos em Esparta","Estrangeiros em Atenas","Escravos libertos de Roma","Soldados persas",0,"Os esparciatas compunham o grupo de cidadãos plenos."],["A economia espartana dependia muito de...","agricultura","fábricas","petróleo","bancos",0,"A produção agrícola sustentava a sociedade espartana."],["Qual atividade teve grande importância econômica em Atenas?","Comércio marítimo","Extração de petróleo","Indústria automobilística","Pecuária polar",0,"Atenas tinha comércio marítimo e atividades artesanais importantes."],["Na Atenas antiga, os metecos eram...","estrangeiros residentes","reis hereditários","generais macedônicos","senadores romanos",0,"Metecos eram estrangeiros residentes sem direitos políticos de cidadãos."],["Antes da democracia, Atenas passou por governos como...","monarquia e aristocracia","império industrial","república presidencial","feudalismo medieval",0,"A organização política ateniense mudou ao longo do tempo."],["Qual legislador ateniense é associado a reformas e ao fim da escravidão por dívidas?","Sólon","Júlio César","Rômulo","Leônidas",0,"Sólon promoveu reformas sociais e políticas."],["Clístenes é lembrado por...","reformas que fortaleceram a democracia ateniense","fundar Roma","conquistar a Pérsia","governar Esparta como rei único",0,"Suas reformas ampliaram a organização da participação cidadã."],["Na democracia ateniense, decisões políticas eram tomadas...","diretamente por cidadãos em assembleias","por todos os moradores","somente por imperadores","por voto eletrônico",0,"A participação era direta, mas restrita aos cidadãos."],["Quem ficava excluído da cidadania política ateniense?","Mulheres, escravizados e estrangeiros","Todos os homens livres adultos","Todos os proprietários","Todos os soldados",0,"A democracia ateniense não incluía toda a população."],["A democracia atual difere da ateniense porque frequentemente é...","representativa e com cidadania mais ampla","exclusiva de aristocratas","sempre monárquica","sem eleições",0,"Em muitas democracias atuais, representantes são eleitos e o sufrágio é mais amplo."],["Os Jogos Olímpicos da Grécia antiga eram realizados em homenagem a...","Zeus","Marte","Rômulo","Cleópatra",0,"Os jogos tinham dimensão religiosa ligada a Zeus."],["Na cultura grega, o ideal de formação física relacionava-se a...","harmonia, força e preparo corporal","apenas riqueza","somente vestimentas","ausência de exercícios",0,"A educação física era associada a ideais de beleza e desenvolvimento corporal."],["Uma causa do enfraquecimento das pólis foi...","guerras entre cidades gregas","a invenção da imprensa","a queda de Constantinopla","a Revolução Industrial",0,"Conflitos prolongados enfraqueceram as cidades gregas."],["Qual reino conquistou as pólis gregas no século IV a.C.?","Macedônia","Egito moderno","Portugal","França",0,"A Macedônia expandiu seu domínio sobre as cidades gregas."],["Qual governante macedônico expandiu conquistas até regiões da Ásia?","Alexandre, o Grande","Augusto","Sólon","Tarquínio",0,"Alexandre formou um vasto império."],["O Helenismo foi marcado pela...","mistura de elementos culturais gregos e orientais","extinção da cultura grega","criação da democracia romana","industrialização da Grécia",0,"As conquistas favoreceram intercâmbios culturais."],["Qual cidade se tornou importante centro cultural helenístico?","Alexandria","Esparta","Pompeia","Troia",0,"Alexandria destacou-se como centro de estudos e cultura."],["Segundo a tradição, Roma foi fundada por...","Rômulo","Péricles","Homero","Alexandre",0,"A narrativa tradicional atribui a fundação a Rômulo."],["Quais são as três grandes fases políticas da Roma antiga?","Monarquia, República e Império","Feudalismo, Renascimento e República","Democracia, Ditadura e Socialismo","Pré-História, Idade Média e Modernidade",0,"A periodização mais comum divide Roma em Monarquia, República e Império."],["Durante a monarquia romana, o poder era exercido principalmente por...","um rei","um presidente eleito","um imperador bizantino","um cônsul único vitalício",0,"Na monarquia, Roma era governada por reis."],["Na Roma antiga, os patrícios eram...","membros de famílias aristocráticas","povos da China","todos os escravizados","soldados de Atenas",0,"Os patrícios integravam a elite social romana."],["Os plebeus eram...","parte da população livre não pertencente à elite patrícia","reis romanos","deuses gregos","governantes macedônicos",0,"Os plebeus formavam um grupo social diverso, com menos privilégios políticos inicialmente."],["Na República romana, os cônsules eram...","magistrados eleitos com funções de governo e comando militar","reis hereditários","sacerdotes gregos","escravizados libertos",0,"Dois cônsules exerciam importantes funções executivas."],["Qual foi uma conquista política dos plebeus na República romana?","Criação do cargo de tribuno da plebe","Fim imediato de toda desigualdade","Extinção do Senado","Direito universal ao voto para escravizados",0,"Tribunos defendiam interesses da plebe."]];
var app=document.getElementById('app'),items=[],idx=0,answers=[],mode='prova',revealed=false;
function el(s){app.innerHTML=s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function start(){mode=document.getElementById('mode').value;items=bank.map(function(q,i){return {q:q,i:i}});if(document.getElementById('shuffle').checked){for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=items[i];items[i]=items[j];items[j]=t}}answers=new Array(items.length).fill(-1);idx=0;show()}
function show(){revealed=false;var q=items[idx].q;var s='<p class="muted">Questão '+(idx+1)+' de '+items.length+'</p><div id="bar"><div id="fill" style="width:'+((idx+1)/items.length*100)+'%"></div></div><h2>'+esc(q[0])+'</h2>';for(var i=0;i<4;i++)s+='<label class="choice"><input type="radio" name="answer" value="'+i+'" '+(answers[idx]===i?'checked':'')+'> '+String.fromCharCode(65+i)+') '+esc(q[i+1])+'</label>';s+='<div id="feedback"></div><button id="back" '+(idx===0?'disabled':'')+'>Anterior</button><button id="next">'+(idx===items.length-1?'Finalizar':'Próxima')+'</button>';el(s);document.getElementById('back').onclick=function(){idx--;show()};document.getElementById('next').onclick=next;var radios=app.querySelectorAll('input[name="answer"]');for(var k=0;k<radios.length;k++)radios[k].onchange=function(){answers[idx]=Number(this.value);if(mode==='treino')feedback()};if(mode==='treino'&&answers[idx]!==-1)feedback()}
function feedback(){var q=items[idx].q,correct=answers[idx]===q[5];document.getElementById('feedback').innerHTML='<p class="'+(correct?'ok':'bad')+'"><strong>'+(correct?'Correto!':'Ainda não. Resposta: '+String.fromCharCode(65+q[5]))+'</strong></p><p>'+esc(q[6])+'</p>'}
function next(){if(answers[idx]===-1){alert('Selecione uma alternativa para continuar.');return}if(idx<items.length-1){idx++;show()}else result()}
function result(){var score=0,s='';for(var i=0;i<items.length;i++)if(answers[i]===items[i].q[5])score++;s='<h2>Resultado</h2><h1>'+((score/items.length)*10).toFixed(1).replace('.',',')+' / 10</h1><p>'+score+' acertos de '+items.length+' ('+Math.round(score/items.length*100)+'%).</p><button id="retry">Refazer simulado</button><button id="print">Imprimir</button><h2>Gabarito comentado</h2>';for(var j=0;j<items.length;j++){var q=items[j].q,ok=answers[j]===q[5];s+='<details><summary class="'+(ok?'ok':'bad')+'">Questão '+(j+1)+' — '+(ok?'✓ Acertou':'✗ Errou')+'</summary><p>'+esc(q[0])+'</p><p>Sua resposta: '+String.fromCharCode(65+answers[j])+'. Correta: '+String.fromCharCode(65+q[5])+'.</p><p>'+esc(q[6])+'</p></details><hr>'}el(s);document.getElementById('retry').onclick=function(){location.reload()};document.getElementById('print').onclick=function(){window.print()}}
document.getElementById('start').onclick=start;
})();</script></body></html>
