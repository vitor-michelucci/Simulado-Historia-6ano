<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado FTD — História 6º ano</title><style>body{font:17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#f2f5fa;color:#1d2c40;margin:0}main{max-width:760px;margin:24px auto;padding:14px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 24px #1d2c4014}button,select{font:inherit}button{border:0;border-radius:10px;background:#164d91;color:white;padding:13px 18px;margin:8px 8px 8px 0;cursor:pointer}button:disabled{opacity:.4}select{padding:10px;max-width:100%}.choice{display:block;padding:13px;border:1px solid #d2dbe7;border-radius:12px;margin:10px 0;cursor:pointer}.choice.selected{background:#eaf3ff;border-color:#164d91}.muted{color:#5a687a}.good{color:#087544}.wrong{color:#b42318}.progress{height:8px;background:#e5eaf0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#164d91}.topic{font-size:14px;color:#53647b}details{padding:12px 0;border-bottom:1px solid #ddd}summary{cursor:pointer}h1{font-size:27px}h2{font-size:21px}</style></head><body><main><div class="panel"><h1>🏛️ História — 6º ano</h1><p class="muted">Novo simulado • 40 questões originais baseadas nas páginas fotografadas da apostila FTD</p><div id="app"><p>Escolha como estudar:</p><select id="mode"><option value="prova">Modo prova — correção ao final</option><option value="treino">Modo treinamento — correção imediata</option></select><p><label><input id="shuffle" type="checkbox"> Embaralhar questões</label></p><button id="start">Começar simulado</button></div></div></main><script>(function(){'use strict';var data=[["Origens da Grécia",152,"Segundo a apostila, qual povo esteve entre os primeiros a se estabelecer na região da Grécia? ",["Aqueus","Romanos","Etruscos","Cartagineses"],0,"Os aqueus estiveram entre os primeiros povos a se estabelecer na região."],["Origens da Grécia",152,"Qual sequência corresponde à chegada dos povos mencionados na formação da Grécia?",["Dórios, aqueus, jônios","Aqueus, jônios e eólios, depois dórios","Romanos, gregos, persas","Etruscos, aqueus, romanos"],1,"O texto menciona os aqueus, a chegada de jônios e eólios e, posteriormente, dos dórios."],["Micenas",153,"Por que Micenas possuía grandes muralhas de pedra?",["Para armazenar água","Para proteger a população de invasões","Para realizar jogos","Para marcar o limite do mar"],1,"As muralhas protegiam a cidade contra ataques inimigos."],["Micenas",153,"Na reconstrução de Micenas, onde ficava o palácio real?",["Na área mais elevada","Fora das muralhas","Junto ao porto","Na área das cabanas"],0,"O palácio real ocupava a parte mais alta da cidade."],["Micenas",153,"O que a diferença entre as casas ricas e as cabanas pobres sugere?",["Ausência de diferenças sociais","Diferenças de condições de vida","Todos viviam no palácio","A cidade não tinha artesãos"],1,"A distribuição e os materiais das moradias evidenciam desigualdades sociais."],["Heróis homéricos",155,"Qual poema narra o retorno de Odisseu a Ítaca?",["Ilíada","Odisseia","Eneida","Teogonia"],1,"A Odisseia narra a viagem de retorno de Odisseu após a Guerra de Troia."],["Heróis homéricos",155,"Como os poemas homéricos eram transmitidos inicialmente?",["Por jornais","Por narrativas orais cantadas por aedos","Por televisão","Por inscrições em moedas"],1,"Os aedos cantavam e transmitiam oralmente essas histórias."],["Pólis gregas",157,"A partir do século IX a.C., as pólis eram...",["Cidades-Estados com organização própria","Províncias governadas por Roma","Países modernos","Aldeias sem leis"],0,"As pólis possuíam economia, leis e organização social próprias."],["Pólis gregas",157,"Qual afirmação explica por que se fala em civilização grega, apesar da independência das pólis?",["Todas tinham o mesmo rei","Compartilhavam língua e costumes semelhantes","Não havia diferenças econômicas","Todas ficavam na mesma ilha"],1,"Havia uma identidade cultural compartilhada, embora fossem Estados independentes."],["Pólis gregas",157,"Por que os templos frequentemente ocupavam a parte mais alta das pólis?",["Porque eram fábricas","Pelo papel religioso e pelo culto ao deus patrono","Porque abrigavam todos os moradores","Para esconder mercados"],1,"Os templos eram espaços importantes de culto ao deus protetor da cidade."],["Esparta e Atenas",159,"Qual fator ajudou Atenas a se tornar centro comercial?",["Sua localização próxima ao mar e o porto do Pireu","A ausência de barcos","Sua localização no interior do Peloponeso","A proibição do comércio"],0,"O porto do Pireu favoreceu a navegação e as trocas comerciais."],["Esparta",159,"Quais eram os três grupos sociais destacados na apostila?",["Patrícios, plebeus e clientes","Espartanos, periecos e hilotas","Cidadãos, metecos e senadores","Reis, cônsules e censores"],1,"A sociedade espartana era dividida em espartanos, periecos e hilotas."],["Esparta",159,"Quem tinha direitos políticos plenos em Esparta?",["Todos os habitantes","Somente os hilotas","Os espartanos ou esparciatas","Todos os comerciantes"],2,"Os esparciatas eram os cidadãos que controlavam o poder político."],["Esparta",160,"Qual atividade era associada aos periecos?",["Manufatura e comércio","Exclusivamente o governo","Escrita de leis atenienses","Fundação de Roma"],0,"Os periecos podiam atuar no comércio e na manufatura."],["Esparta",160,"Qual era a condição dos hilotas?",["Reis eleitos","Trabalhadores escravizados ligados à produção","Cidadãos com voto","Mercadores estrangeiros livres"],1,"Os hilotas foram submetidos à condição de trabalhadores escravizados."],["Esparta",160,"Segundo a pirâmide ilustrada, a educação militar espartana começava...",["Aos 7 anos","Aos 30 anos","Aos 60 anos","Aos 20 anos"],0,"A partir dos 7 anos, os meninos eram encaminhados para educação militar."],["Esparta",160,"Entre 16 e 20 anos, o treinamento dos jovens espartanos...",["Era interrompido","Tornava-se mais intenso","Era substituído pelo comércio","Passava a ser exclusivamente religioso"],1,"O treinamento militar se intensificava nessa fase."],["Atenas",162,"Quais grupos formavam a sociedade ateniense apresentada na apostila?",["Cidadãos, metecos e pessoas escravizadas","Esparciatas, periecos e hilotas","Patrícios e plebeus","Reis e cônsules"],0,"A pirâmide social ateniense destaca cidadãos, metecos e pessoas escravizadas."],["Atenas",162,"Quem eram os metecos?",["Cidadãos com todos os direitos","Estrangeiros residentes, sem direitos políticos","Reis de Atenas","Escravizados da agricultura"],1,"Metecos eram estrangeiros que viviam em Atenas, sem direitos políticos."],["Atenas",162,"Na sociedade ateniense, quem podia participar das atividades políticas?",["Todos os moradores","Os cidadãos reconhecidos como tais","Somente os metecos","Todas as mulheres"],1,"A participação política estava reservada aos cidadãos."],["Mulheres em Atenas",163,"Segundo o texto, a sociedade ateniense era...",["Matriarcal","Patriarcal","Sem diferenças de gênero","Governada apenas por sacerdotisas"],1,"O texto caracteriza Atenas como uma sociedade patriarcal."],["Mulheres em Atenas",163,"Qual alternativa descreve uma atividade de mulheres das camadas populares?",["Administrar tabernas e vender mercadorias","Votar na assembleia","Exercer o cargo de cônsul","Comandar o Senado"],0,"Mulheres das camadas mais baixas também atuavam no pequeno comércio."],["Política ateniense",164,"Antes das reformas, a aristocracia ateniense concentrava o poder nas mãos...",["Dos metecos","De um pequeno grupo de grandes proprietários","De todos os habitantes","Dos hilotas"],1,"A aristocracia era o governo de um grupo privilegiado."],["Política ateniense",164,"Qual problema social provocou revoltas e pressões por reformas?",["Dívidas que levavam pequenos proprietários à escravização","Excesso de eleições universais","Fim da agricultura","Ausência de comerciantes"],0,"O endividamento e a escravização por dívidas contribuíram para os conflitos."],["Legisladores",165,"Qual era uma função dos legisladores de Atenas?",["Registrar leis por escrito","Comandar legiões romanas","Fundar cidades no Egito","Organizar o Senado romano"],0,"Os legisladores passaram a registrar por escrito as leis da cidade."],["Legisladores",165,"Qual reforma é associada a Sólon no texto?",["Escravização por dívidas","Fim da escravização por dívidas","Criação do Império Romano","Extinção de todas as assembleias"],1,"O material destaca o fim da escravização por dívidas entre as reformas."],["Legisladores",165,"O Código Draconiano ficou conhecido...",["Pela severidade das leis","Por criar os Jogos Olímpicos","Por extinguir a escrita","Por instituir o Império Macedônico"],0,"A apostila ressalta o caráter severo das leis de Drácon."],["Democracia",166,"Qual governante é associado ao nascimento da democracia ateniense?",["Clístenes","Rômulo","Filipe II","Tarquínio II"],0,"Clístenes promoveu reformas que estabeleceram a democracia ateniense."],["Democracia",166,"Quem podia participar da assembleia ateniense, segundo a apostila?",["Qualquer pessoa adulta","Cidadãos atenienses homens com mais de 20 anos","Todos os estrangeiros","Mulheres e escravizados"],1,"O texto estabelece restrições de cidadania, gênero e idade."],["Democracia",166,"Como Péricles ampliou a participação de cidadãos mais pobres?",["Pagando pelo exercício de funções públicas","Proibindo reuniões","Extinguindo os cargos","Restringindo o direito de debate"],0,"A remuneração de funções públicas ajudava cidadãos pobres a participar."],["Esportes",169,"Os Jogos Pan-Helênicos contribuíam principalmente para...",["Criar identidade cultural comum entre gregos","Separar permanentemente as cidades","Substituir as leis","Impedir celebrações religiosas"],0,"Os jogos reuniam atletas e expressavam unidade cultural."],["Esportes",169,"Segundo a apostila, os Jogos Nemeus aconteciam...",["Na região do Peloponeso","Em Roma","No Egito","Na Mesopotâmia"],0,"Os Jogos Nemeus eram realizados em Nemeia, no so e fiscalizava a moralidade pública."]],app=document.getElementById('app'),items=[],idx=0,answers=[],mode='prova';function e(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function begin(){mode=document.getElementById('mode').value;items=data.slice();if(document.getElementById('shuffle').checked){for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=items[i];items[i]=items[j];items[j]=x}}answers=Array(items.length).fill(-1);idx=0;show()}function show(){var q=items[idx],s='<p class="topic">'+e(q[0])+' • Apostila p. '+q[1]+'</p><p class="muted">Questão '+(idx+1)+' de '+items.length+'</p><div class="progress"><div class="fill" style="width:'+((idx+1)*100/items.length)+'%"></div></div><h2>'+e(q[2])+'</h2>';for(var k=0;k<4;k++)s+='<label class="choice '+(answers[idx]===k?'selected':'')+'"><input type="radio" name="ans" value="'+k+'" '+(answers[idx]===k?'checked':'')+'> '+String.fromCharCode(65+k)+') '+e(q[3][k])+'</label>';s+='<div id="feedback"></div><button id="prev" '+(idx===0?'disabled':'')+'>Anterior</button><button id="next">'+(idx===items.length-1?'Finalizar':'Próxima')+'</button>';app.innerHTML=s;app.querySelector('#prev').onclick=function(){idx--;show()};app.querySelector('#next').onclick=function(){if(answers[idx]<0){alert('Selecione uma alternativa.');return}if(idx===items.length-1)finish();else{idx++;show()}};var rr=app.querySelectorAll('input[name="ans"]');for(var a=0;a<rr.length;a++)rr[a].onchange=function(){answers[idx]=Number(this.value);show()};if(mode==='treino'&&answers[idx]>=0){var ok=answers[idx]===q[4];app.querySelector('#feedback').innerHTML='<p class="'+(ok?'good':'wrong')+'"><strong>'+(ok?'Resposta correta!':'Resposta incorreta. Correta: '+String.fromCharCode(65+q[4]))+'</strong></p><p>'+e(q[5])+'</p>'}}function finish(){var n=0,s='';for(var i=0;i<items.length;i++)if(answers[i]===items[i][4])n++;s='<h2>Resultado do simulado</h2><h1>Nota: '+(n*10/items.length).to
